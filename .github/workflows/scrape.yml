name: WebScraper BCR to Peviitor

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: false
        
      - name: Run scraper
        run: npm run scrape
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          
      - name: Check for new jobs
        run: |
          if [ -f jobs.json ] || [ -f docs/jobs.json ]; then
            echo "New jobs found:"
            jq '.jobs | length' docs/jobs.json 2>/dev/null || jq '.jobs | length' jobs.json 2>/dev/null || echo "0"
          else
            echo "No new jobs or scrape failed"
          fi
          
      - name: Commit updated jobs.json to repo
        run: |
          if [ -f docs/jobs.json ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add docs/jobs.json
            if git diff --cached --quiet; then
              echo "No changes to docs/jobs.json"
            else
              git commit -m "Update docs/jobs.json with latest scrape results"
              git pull --rebase origin master
              git push
            fi
          fi
          
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            jobs.json
            jobs_existing.json
            docs/jobs.json
          retention-days: 7
