name: Automation Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no deletions)'
        required: true
        default: 'true'

jobs:
  ensure-company-core:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ensure BCR exists and is up-to-date in company core
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
        run: |
          # Check if BCR exists and get current data
          CURRENT=$(curl -s --user "${SOLR_AUTH}" \
            "https://solr.peviitor.ro/solr/company/select?q=id:361757&rows=1&wt=json")
          
          NUM_FOUND=$(echo "$CURRENT" | jq '.response.numFound')
          echo "BCR count in company core: $NUM_FOUND"
          
          # Expected data from demoANAF
          EXPECTED_COMPANY="BANCA COMERCIALA ROMANA SA"
          EXPECTED_BRAND="BCR"
          
          if [ "$NUM_FOUND" -eq "0" ]; then
            echo "BCR not found - adding to company core..."
            echo "[{\"id\":\"361757\",\"company\":\"BANCA COMERCIALA ROMANA SA\",\"brand\":\"BCR\",\"status\":\"activ\",\"location\":[\"București\"],\"website\":[\"https://www.bcr.ro\"],\"career\":[\"https://erstegroup-careers.com/bcr/go/bcr-careire/4305601/\"],\"lastScraped\":\"2026-04-30\",\"scraperFile\":\"https://raw.githubusercontent.com/lavilapustea24/banca-commerciala-romana-sa-nodejs-scraper/master/.github/workflows/scrape.yml\"}]" > company_data.json
            
            curl -s --user "${SOLR_AUTH}" \
              "https://solr.peviitor.ro/solr/company/update/json?commit=true" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @company_data.json
              
            echo "✅ BCR added to company core"
          else
            # Check if data matches demoANAF
            CURRENT_COMPANY=$(echo "$CURRENT" | jq -r '.response.docs[0].company // empty')
            CURRENT_BRAND=$(echo "$CURRENT" | jq -r '.response.docs[0].brand // empty')
            
            echo "Current company: $CURRENT_COMPANY"
            echo "Current brand: $CURRENT_BRAND"
            
            if [ "$CURRENT_COMPANY" != "$EXPECTED_COMPANY" ] || [ "$CURRENT_BRAND" != "$EXPECTED_BRAND" ]; then
              echo "⚠️ Data mismatch detected! Updating..."
              
              # Delete old data
              curl -s --user "${SOLR_AUTH}" \
                "https://solr.peviitor.ro/solr/company/update/json?commit=true" \
                -X POST \
                -H "Content-Type: application/json" \
                -d '{"delete":{"query":"id:361757"}}'
              
              # Add correct data
              echo "[{\"id\":\"361757\",\"company\":\"BANCA COMERCIALA ROMANA SA\",\"brand\":\"BCR\",\"status\":\"activ\",\"location\":[\"București\"],\"website\":[\"https://www.bcr.ro\"],\"career\":[\"https://erstegroup-careers.com/bcr/go/bcr-careire/4305601/\"],\"lastScraped\":\"2026-04-30\",\"scraperFile\":\"https://raw.githubusercontent.com/lavilapustea24/banca-commerciala-romana-sa-nodejs-scraper/master/.github/workflows/scrape.yml\"}]" > company_data.json
              
              curl -s --user "${SOLR_AUTH}" \
                "https://solr.peviitor.ro/solr/company/update/json?commit=true" \
                -X POST \
                -H "Content-Type: application/json" \
                --data-binary @company_data.json
              
              echo "✅ BCR data updated in company core"
            else
              echo "✅ BCR data is correct in company core - no action needed"
            fi
          fi
          
          # Final verification
          FINAL=$(curl -s --user "${SOLR_AUTH}" \
            "https://solr.peviitor.ro/solr/company/select?q=id:361757&rows=1" | jq '.response.numFound')
          
          echo "BCR count after check: $FINAL"
          
          if [ "$FINAL" -ge "1" ]; then
            echo "✅ SUCCESS: BCR is in company core with correct data"
          else
            echo "❌ FAILED: BCR still not in company core"
            exit 1
          fi

  Automation-Tests:
    runs-on: ubuntu-latest
    needs: ensure-company-core
    
    steps:
      - uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Puppeteer Chromium
        run: npx @puppeteer/browsers install chromium@latest --path .local-chromium
        
      - name: Run Unit Tests
        run: npm run test:unit
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          PUPPETEER_EXECUTABLE_PATH: .local-chromium/chrome-linux64/chrome
           
      - name: Run Integration Tests
        run: npm run test:integration
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          PUPPETEER_EXECUTABLE_PATH: .local-chromium/chrome-linux64/chrome
            
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          PUPPETEER_EXECUTABLE_PATH: .local-chromium/chrome-linux64/chrome
